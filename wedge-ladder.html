<head>

<title>Wedge Ladder · VibeGolf</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@400;500;600;700;800&family=Hanken+Grotesk:wght@400;500;600&display=swap">

<style>
/* Wedge Ladder extras: the departures-style flight board that shows your rung (under the tools). */
.wl-board { width: 146px; padding: 7px 8px 8px; background: #0d0f12; border: 1px solid #2c3036; border-radius: 10px; font-family: "Saira Semi Condensed", "Arial Narrow", monospace; box-shadow: 0 6px 18px rgba(0,0,0,0.4); }
.wl-body { display: grid; grid-template-columns: 14px 1fr; gap: 5px; align-items: start; }
.wl-strip { display: block; width: 14px; border-radius: 3px; margin-top: 2px; }
.wl-board .hd { display: flex; justify-content: space-between; font-size: 9.5px; letter-spacing: 0.16em; color: #f2c31a; margin-bottom: 4px; }
.wl-row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px; margin-top: 2px; padding: 1px 4px; border-radius: 3px; background: #16191e; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: #6c727a; font-variant-numeric: tabular-nums; }
.wl-row .st { font-size: 9px; letter-spacing: 0.12em; }
.wl-row.done { color: #c8d0d8; } .wl-row.done .st { color: #5aff8a; }
.wl-row.best .st::after { content: " ★"; color: #f2c31a; }
.wl-row.cur { background: #f2c31a; color: #1a1406; } .wl-row.cur .st { color: #1a1406; animation: wlBlink 1s steps(2, jump-none) infinite; }
.wl-row.flip { animation: wlFlip .45s ease; }
@keyframes wlBlink { 50% { opacity: 0.3; } }
@keyframes wlFlip { 0% { transform: rotateX(90deg); } 100% { transform: none; } }
@media (min-height: 560px) and (min-width: 900px) { .wl-board { width: 176px; } .wl-body { grid-template-columns: 18px 1fr; } .wl-strip { width: 18px; } .wl-row { font-size: 14px; } }
@media (max-width: 760px) and (orientation: landscape) { .wl-board { width: 124px; padding: 5px 6px 6px; } .wl-row { font-size: 10.5px; margin-top: 1px; } .wl-row .st { font-size: 8px; } }
</style>
</head>

</body>
</html>
