<style>
/* Zombie Siege extras: fence health (top centre) and the field map under the tools */
.zs-fence { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 8px); transform: translateX(-50%); z-index: 5; display: flex; align-items: center; gap: 8px; padding: 6px 12px; }
.zs-bar { width: 150px; height: 9px; border-radius: 6px; background: rgba(255,255,255,0.12); overflow: hidden; }
.zs-bar i { display: block; height: 100%; width: 100%; border-radius: 6px; background: linear-gradient(90deg, #6dff6d, #b8ff5a); transition: width .25s ease; }
.zs-fence[data-level="warn"] .zs-bar i { background: linear-gradient(90deg, #ffb040, #ffd257); }
.zs-fence[data-level="bad"] .zs-bar i { background: linear-gradient(90deg, #ff3a3a, #ff6a4a); animation: zsPulse 0.8s ease-in-out infinite; }
.zs-fence b { font-size: 14px; min-width: 3.2ch; text-align: right; }
@keyframes zsPulse { 50% { opacity: 0.55; } }
.zs-map { width: 116px; height: 190px; padding: 4px; cursor: crosshair; }
.zs-map canvas { display: block; width: 100%; height: 100%; }
@media (min-height: 560px) and (min-width: 900px) { .zs-map { width: 150px; height: 250px; } .zs-bar { width: 220px; } }
@media (max-width: 760px) and (orientation: landscape) { .zs-map { width: 100px; height: 170px; } .zs-bar { width: 96px; } .zs-fence { padding: 5px 9px; gap: 6px; } }
</style>
