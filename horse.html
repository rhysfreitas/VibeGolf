<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14162a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VibeGolf">
<title>Golf HORSE · VibeGolf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@400;500;600;700;800&family=Hanken+Grotesk:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles/minigame.css">
<link rel="stylesheet" href="styles/shared.css">
<style>
/* Golf HORSE extras: the LED basketball scoreboard (top centre) where the setter calls the shot,
   and the street map under the tools. */
:root { --led: #ffb43a; --led-hi: #ffe08a; --led-red: #ff4a32; --led-off: #4a3826; }
.hb { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 6px); transform: translateX(-50%); z-index: 6;
  width: min(372px, calc(100vw - 440px)); min-width: 236px; padding: 5px 8px 6px; border-radius: 10px;
  background: radial-gradient(circle at 2px 2px, rgba(255,170,60,0.07) 1px, transparent 1.4px) 0 0 / 5px 5px, #0a0b0d;
  border: 2px solid #2b2e35; box-shadow: 0 6px 22px rgba(0,0,0,0.45), inset 0 0 0 1px #000;
  font-family: var(--f-data); color: var(--led); user-select: none; -webkit-user-select: none; }
.hb .led { text-shadow: 0 0 6px currentColor; font-variant-numeric: tabular-nums; }
.hb-top { display: grid; grid-template-columns: 1.25fr 1fr 1fr; gap: 6px; }
.hb-cell { display: flex; flex-direction: column; align-items: center; min-width: 0; }
.hb-lbl { font-size: 8.5px; letter-spacing: 0.16em; color: var(--led-red); text-shadow: 0 0 5px rgba(255,74,50,0.6); }
.hb-val { display: flex; align-items: center; justify-content: center; gap: 4px; width: 100%; }
.hb button { appearance: none; border: 0; background: transparent; color: inherit; font: inherit; padding: 0; cursor: pointer; }
.hb .arr { width: 22px; height: 26px; border-radius: 6px; font-size: 12px; color: var(--led); opacity: 0.85; }
.hb .tog { width: 100%; border-radius: 6px; padding: 1px 0; }
.hb-yd { font-size: 26px; font-weight: 800; line-height: 1; letter-spacing: 0.02em; min-width: 2.2ch; text-align: center; }
.hb-txt { font-size: 18px; font-weight: 700; line-height: 1.15; letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; }
.hb-line { font-size: 9.5px; color: var(--led-hi); opacity: 0.8; letter-spacing: 0.06em; min-height: 11px; }
.hb.edit .tog, .hb.edit .arr { background: rgba(255,180,58,0.1); box-shadow: inset 0 0 0 1px rgba(255,180,58,0.35); }
.hb:not(.edit) .arr { visibility: hidden; }
.hb:not(.edit) button { cursor: default; }
.hb-status { text-align: center; font-size: 12px; font-weight: 700; letter-spacing: 0.14em; color: var(--led-hi); text-transform: uppercase; margin: 3px 0 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hb.edit .hb-status { animation: hbBlink 1.4s steps(2, jump-none) infinite; }
@keyframes hbBlink { 50% { opacity: 0.55; } }
.hb-players { display: grid; grid-template-columns: 1fr 1fr; gap: 1px 12px; border-top: 1px solid #23262c; padding-top: 3px; }
.hb-players.one { grid-template-columns: 1fr; }
.hb-players.many .hb-p { font-size: 10.5px; gap: 3px; }
.hb-players.many .lt i { width: 0.8em; }
.hb-p { display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #b9822f; min-width: 0; }
.hb-p .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hb-p.cur .nm { color: var(--led-hi); text-shadow: 0 0 6px var(--led-hi); }
.hb-p.set .nm::after { content: " ●"; color: var(--led-red); font-size: 9px; vertical-align: 2px; }
.hb-p.out { opacity: 0.4; text-decoration: line-through; }
.hb-p .lt { display: flex; gap: 1px; flex: none; }
.hb-p .lt i { font-style: normal; width: 0.92em; text-align: center; color: var(--led-off); }
.hb-p .lt i.on { color: var(--led-red); text-shadow: 0 0 7px var(--led-red); }
.hb-p .lt i.stamp { animation: hbStamp .7s cubic-bezier(.2,1.6,.4,1); }
@keyframes hbStamp { 0% { transform: scale(3.2) rotate(-14deg); opacity: 0; } 60% { opacity: 1; } 100% { transform: none; } }
.hb.flip .hb-top { animation: hbFlip .5s ease; }
@keyframes hbFlip { 0% { opacity: 0.2; filter: blur(2px); } 100% { opacity: 1; filter: none; } }
.mg-result .ok { color: #6dffb0; } .mg-result .no { color: #ff6a5a; }
#mg .mg-toast { top: calc(env(safe-area-inset-top, 0px) + 112px); }
@media (min-height: 560px) and (min-width: 900px) { #mg .mg-toast { top: calc(env(safe-area-inset-top, 0px) + 124px); } }
.ho-map { width: 104px; height: 168px; padding: 4px; cursor: pointer; }
.ho-map canvas { display: block; width: 100%; height: 100%; }
@media (min-height: 560px) and (min-width: 900px) { .hb { width: 430px; padding: 7px 12px 8px; } .hb-yd { font-size: 32px; } .hb-txt { font-size: 22px; } .hb-p { font-size: 14px; } .ho-map { width: 140px; height: 226px; } }
@media (max-width: 760px) and (orientation: landscape) { .hb { width: calc(100vw - 404px); min-width: 230px; padding: 4px 6px 5px; } .hb-yd { font-size: 22px; } .hb-txt { font-size: 15px; } .hb .arr { width: 18px; height: 22px; } .hb-p { font-size: 11px; } .ho-map { width: 92px; height: 140px; } }
@media (orientation: portrait) { .hb { top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 200px); width: min(372px, calc(100vw - 24px)); } }
</style>
</head>
<body>
<div id="stage"></div>
<script src="vendor/three-r147/three.min.js"></script>
<script src="vendor/three-r147/Sky.js"></script>
<script src="vendor/three-r147/lines/LineSegmentsGeometry.js"></script>
<script src="vendor/three-r147/lines/LineGeometry.js"></script>
<script src="vendor/three-r147/lines/LineMaterial.js"></script>
<script src="vendor/three-r147/lines/LineSegments2.js"></script>
<script src="vendor/three-r147/lines/Line2.js"></script>
<script type="module" src="src/minigames/horse.js"></script>
<script type="module" src="src/app.js"></script>
</body>
</html>
