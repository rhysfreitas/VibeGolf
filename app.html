<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101c22">
<meta name="description" content="VibeGolf with the R10 kept connected from page to page.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VibeGolf">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>VibeGolf</title>
<style>
/* The hub: one full-window frame. It sits inside the safe area, because a frame's own pages see no
   safe-area insets (env() is 0 inside a frame), so on a notched phone their controls would sit under the notch. */
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
#game {
  position: fixed; border: 0; display: block; background: #101c22;
  top: env(safe-area-inset-top, 0px); right: env(safe-area-inset-right, 0px);
  bottom: env(safe-area-inset-bottom, 0px); left: env(safe-area-inset-left, 0px);
  width: calc(100% - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
  height: calc(100% - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
}
</style>
</head>
<body>
<iframe id="game" title="VibeGolf" allow="bluetooth; fullscreen; screen-wake-lock; camera; microphone; autoplay" allowfullscreen></iframe>
<script type="module" src="src/hub.js"></script>
</body>
</html>
