<title>Island Hopper · VibeGolf</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@400;500;600;700;800&family=Hanken+Grotesk:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles/minigame.css">
<link rel="stylesheet" href="styles/shared.css">
<style>
/* Island Hopper extras: lives (top centre), island map under the tools, target buttons in the prompt */
.ih-lives { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 8px); transform: translateX(-50%); z-index: 5; display: flex; align-items: center; gap: 6px; padding: 6px 12px; }
.ih-lives i { font-style: normal; font-size: 15px; color: rgba(255,255,255,0.2); transition: color .3s ease; }
.ih-lives i.on { color: #6dffb0; text-shadow: 0 0 8px rgba(109,255,176,0.6); }
.ih-hop { margin-left: 8px; font-family: var(--f-data); font-size: 12px; color: var(--mist); letter-spacing: 0.06em; text-transform: uppercase; }
.ih-hop b { color: var(--bone); font-size: 14px; }
.ih-map { width: 116px; height: 170px; padding: 4px; cursor: pointer; }
.ih-map canvas { display: block; width: 100%; height: 100%; }
.ih-opts { display: flex; gap: 4px; margin-top: 5px; }
.ih-opts button { appearance: none; flex: 1; border: 1px solid var(--line); background: rgba(255,255,255,0.04); border-radius: 7px; padding: 4px 0; cursor: pointer; font-family: var(--f-data); font-size: 12px; font-weight: 600; letter-spacing: 0.04em; color: var(--c); }
.ih-opts button.on { background: var(--c); color: #12141c; border-color: var(--c); }
@media (min-height: 560px) and (min-width: 900px) { .ih-map { width: 150px; height: 220px; } }
@media (max-width: 760px) and (orientation: landscape) { .ih-map { width: 100px; height: 150px; } }
</style>
</head>

<script src="vendor/three-r147/lines/Line2.js"></script>
<script type="module" src="src/minigames/island-hopper.js"></script>
<script type="module" src="src/app.js"></script>
</body>
</html>
