# Builds VibeGolf for Windows (app/, Electron) and, on a tag like app-v1.0.0, attaches the installer to a
# GitHub release. Run by hand (Actions → Windows app → Run workflow) to get the installer as an artifact only.
name: Windows app
on:
  push:
    tags: ['app-v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      # keep the game's files byte for byte as in the repo, so the app's update check matches them
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/app-v')
        working-directory: app
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#app-v}"
      - name: Install
        working-directory: app
        run: npm ci
      - name: Tests
        working-directory: app
        run: npm test
      - name: The game's copy
        working-directory: app
        run: npm run site
      - name: End-to-end check (the real app, the fake R10)
        working-directory: app
        run: node scripts/smoke.mjs
      - name: Installer
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: VibeGolf-Setup
          path: app/dist/*.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/app-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" app/dist/*.exe --title "VibeGolf for Windows ${GITHUB_REF_NAME#app-v}" --notes "Download VibeGolf-Setup-${GITHUB_REF_NAME#app-v}.exe below and run it. Windows shows a 'Windows protected your PC' warning the first time, because the installer isn't signed: click More info, then Run anyway. The app updates the game by itself; a new installer is only needed for changes to the app's own window."
